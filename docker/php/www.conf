; =============================================================================
; PHP-FPM Pool Configuration — production
; =============================================================================
[www]

; Run as www-data (same user Nginx will pass requests to)
user  = www-data
group = www-data

; Use a Unix socket for best performance (matches Nginx fastcgi_pass)
listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; Process management
pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests      = 500

; Logging (stderr → Docker/Render logs)
catch_workers_output = yes
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors]  = on

; Security: clear PHP environment from parent (Render injects its own)
clear_env = no

; Ensure slow log is available for debugging if needed
slowlog             = /dev/stderr
request_slowlog_timeout = 10s
